[package]
name = "lifelinemesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Offline decoder for disaster-response mesh logistics and routing packets"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["disaster-response", "mesh", "parser", "fuzzing"]
categories = ["parser-implementations", "network-programming"]

[dependencies]

[lib]
name = "lifelinemesh"
path = "src/lib.rs"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
debug = true
overflow-checks = true
panic = "abort"
