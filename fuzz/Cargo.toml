[package]
name = "lifelinemesh-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
lifelinemesh = { path = ".." }
libfuzzer-sys = { path = "libfuzzer-sys" }

[workspace]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "batch_fuzzer"
path = "fuzz_targets/batch_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_fuzzer"
path = "fuzz_targets/manifest_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_script_fuzzer"
path = "fuzz_targets/route_script_fuzzer.rs"
test = false
doc = false
bench = false
